# Hetzner CPX11 stack: n8n + Postgres + Caddy + attribution service
# Usage: copy .env.example -> .env (HUMAN-CHECKPOINT: fill secrets), then
#   docker compose up -d
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      GENERIC_TIMEZONE: UTC
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      NODE_OPTIONS: "--max-old-space-size=768"   # cap node RAM; FFmpeg writes to disk
    volumes:
      - n8n_data:/home/node/.n8n
      - media_work:/data/media          # FFmpeg/edge-tts scratch (disk, not RAM)

  attribution:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    command: sh -c "pip install --no-cache-dir cryptography -q && python -m src.attribution.server"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      IP_SALT: ${IP_SALT}
      DS24_IPN_PASSPHRASE: ${DS24_IPN_PASSPHRASE}
      CB_INS_SECRET: ${CB_INS_SECRET}
      OFFERS_CONFIG: /app/deploy/offers.json
      PORT: "8080"
    volumes:
      - ..:/app:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
      - attribution

volumes:
  pg_data:
  n8n_data:
  media_work:
  caddy_data:
  caddy_config:
